aid: iantrek
name: Iantrek
description: 'Iantrek, Inc. is a venture-backed ophthalmic medical technology company
  headquartered in White Plains, New York, pioneering the field it calls bio-interventional
  ophthalmic surgery (BIOS) for the treatment of glaucoma. Founded in 2019 by ophthalmic
  innovator Sean Ianchulev, MD, MPH, the company develops micro-interventional surgical
  devices that reinforce and restore the eye''s natural aqueous outflow pathways with
  biologic allograft tissue rather than bypassing or removing tissue. Its commercial
  and pipeline portfolio includes AlloFlo Uveo, AlloSert Uveo, C-Rex and AlloSpan Canal.
  Iantrek has raised approximately $103M across its rounds, including a $42M Series C
  used to launch AlloFlo Uveo in the United States in October 2025. Iantrek publishes
  a corporate and surgeon-facing marketing website at iantrekmed.com; it operates no
  public developer portal, documentation, or machine-readable API surface.'
